services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no arquivo .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no arquivo .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env.production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - frequency-backups:/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      FREQUENCY_DOMAIN: ${FREQUENCY_DOMAIN:?defina FREQUENCY_DOMAIN no arquivo .env.production}
      FREQUENCY_BILLING_REQUIRED: ${FREQUENCY_BILLING_REQUIRED:?defina FREQUENCY_BILLING_REQUIRED=YES no arquivo .env.production}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  frequency-backups:
  caddy-data:
  caddy-config:
